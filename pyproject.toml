[project]
name = "niuno3"
version = "0.1.0"
description = "Local-first ETF research and paper trading"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "beautifulsoup4>=4.13,<5",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
